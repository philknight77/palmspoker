<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Palms Floor</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="logo.png" />
<!--
  Palms Poker · floor panel for the cash games (Leo, 23.11) — the web twin of
  the app's "⚙ Floor panel": open and close tables, players per table, limits.
  Same Supabase project, same `floor` Edge Function, same rules: sign in with
  the staff account (email code), and only venue_admins can change anything.
  The anon key below is the public one the app ships with.
-->
<style>
  :root {
    --bg: #0e0b2e; --card: #1a1550; --card2: #231d63; --border: #352d7d;
    --text: #eef1f7; --sec: #9aa6bd; --muted: #6c7995;
    --gold: #e0a42d; --goldText: #f2c14e; --onGold: #1a1200;
    --open: #22c55e; --openBg: rgba(34,197,94,.12); --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 0 16px; }
  header .logo { width: 42px; height: 42px; flex: none; }
  .login .logo { width: 96px; height: 96px; align-self: center; margin-bottom: 2px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  header h1 span { color: var(--goldText); }
  header .who { margin-left: auto; color: var(--sec); font-size: 13px; text-align: right; }
  .link { background: none; border: 0; color: var(--goldText); cursor: pointer; padding: 0; font-weight: 700; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; }
  .stat small { color: var(--sec); text-transform: uppercase; letter-spacing: .5px; font-size: 11px; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; }
  .limit { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .limit.live { border-color: rgba(34,197,94,.55); }
  .lhead { display: flex; align-items: baseline; gap: 8px; }
  .lname { font-size: 19px; font-weight: 800; }
  .lmeta { color: var(--sec); font-size: 13px; }
  .lhead .del { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; }
  .lhead .del:hover { color: var(--danger); }
  .closedNote { color: var(--muted); font-size: 13px; }

  .tables { display: flex; flex-direction: column; gap: 8px; }
  .tbl { display: flex; align-items: center; gap: 10px; background: var(--openBg); border: 1px solid rgba(34,197,94,.35); border-radius: 12px; padding: 8px 10px; }
  .tno { min-width: 54px; font-weight: 800; font-size: 17px; }
  .tno small { display: block; color: var(--open); font-size: 10px; letter-spacing: .6px; font-weight: 800; }
  .seats { display: flex; align-items: center; gap: 6px; }
  .seats b { min-width: 48px; text-align: center; font-size: 17px; }
  .round { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--card2); color: var(--text); cursor: pointer; font-size: 18px; font-weight: 800; }
  .round:hover { border-color: var(--gold); }
  .tbl .close { margin-left: auto; }

  .btn { border: 1px solid var(--border); background: var(--card2); color: var(--text); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; }
  .btn:hover { border-color: var(--gold); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--onGold); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  .w70 { width: 70px; } .w90 { width: 90px; } .w120 { width: 120px; }
  .form { background: var(--card2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .err { color: var(--danger); font-size: 13px; min-height: 0; }
  .hint { color: var(--muted); font-size: 12px; }
  .add { border: 1px dashed var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; min-height: 120px; color: var(--goldText); font-weight: 800; cursor: pointer; background: transparent; }
  .add:hover { border-color: var(--gold); }

  .login { max-width: 380px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .login h2 { margin: 0; font-size: 22px; }
  .login p { margin: 0; color: var(--sec); font-size: 14px; }
  .login input { width: 100%; font-size: 17px; padding: 12px; }
  .login .btn { padding: 12px; font-size: 16px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #000c; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; display: none; max-width: calc(100% - 32px); }
  .updated { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }

  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 60px; }
    .grid { grid-template-columns: 1fr; }
    .stat b { font-size: 22px; }
    header h1 { font-size: 19px; }
    .tbl { flex-wrap: wrap; row-gap: 8px; }
    .tbl .max { padding: 7px 6px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://kbpzqlkqorwstwdccsja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImticHpxbGtxb3J3c3R3ZGNjc2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjc1ODYsImV4cCI6MjA5ODk0MzU4Nn0.gYmjX4Uuv0RrGOePN8Gkk05uOWfos2EK0_7PDGM9bPE";
const DEFAULT_SEATS = 8; // our tables are 8-max, as in the app
const CUR = "€";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let state = { session: null, venues: [], venue: null, owner: false, tables: [], step: "email", email: "", busy: false,
  openForm: null, limitForm: false, err: "", loadedAt: null,
  login: "password", // floor staff: username + password; the owner can use an email code
  view: "cash", staff: null, name: "", mustChange: false };
// staff accounts' made-up addresses (supabase/floor_staff.sql)
const STAFF_DOMAIN = "staff.palmspoker.invalid";
// a card number signs in as typed, leading zeros or not ("01652" = "1652")
const toEmail = (u) => (u.includes("@") ? u : `${(/^\d+$/.test(u) ? u.replace(/^0+/, "") : u).toLowerCase()}@${STAFF_DOMAIN}`);
// Supabase wants 6+ characters and Leo's first passwords are 4 digits (the
// card number backwards), so the panel puts this in front of whatever is typed.
const PW_PREFIX = "palms-floor:";
const pw = (typed) => PW_PREFIX + typed;
const backwards = (n) => String(n).split("").reverse().join("");
const nameOf = (email) => ((email || "").endsWith("@" + STAFF_DOMAIN) ? email.split("@")[0] : email);

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500);
}

async function floor(method, body) {
  const { data } = await sb.auth.getSession();
  const token = data.session?.access_token;
  if (!token) throw new Error("Not signed in");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/floor`, {
    method,
    headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const p = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(p.error || `Request failed (${res.status})`);
  return p;
}

const limitKey = (t) => `${t.game}|${t.sb}|${t.bb}`;
const limitName = (t) => `${t.game} ${CUR}${t.sb}/${CUR}${t.bb}`;
const buyin = (t) => t.min_buyin ? `Buy-in ${CUR}${t.min_buyin}${t.max_buyin ? `–${CUR}${t.max_buyin}` : "+"}` : "";

async function loadTables() {
  const { data, error } = await sb.from("cash_tables").select("*").eq("venue_id", state.venue).order("bb").order("table_no");
  if (error) throw error;
  state.tables = data || [];
  state.loadedAt = new Date();
}

function groups() {
  const m = new Map();
  for (const t of state.tables) {
    const k = limitKey(t);
    const g = m.get(k) || { sample: t, open: [], rows: [] };
    g.rows.push(t);
    if (t.is_running) g.open.push(t);
    m.set(k, g);
  }
  return [...m.values()].sort((a, b) => a.sample.bb - b.sample.bb || a.sample.sb - b.sample.sb || a.sample.game.localeCompare(b.sample.game));
}

// ── actions (the same rules as the app's floor panel) ──
async function openTable(sampleId, no, taken, total) {
  const { table } = await floor("POST", { action: "add", fromTableId: sampleId, tableNo: no });
  await floor("POST", { action: "seats", tableId: table.id, seats_taken: taken, seats_total: total });
}
async function closeTable(t) {
  const same = state.tables.filter((x) => limitKey(x) === limitKey(t));
  // the last row of a limit stays as its template, just switched off
  if (same.length > 1) await floor("POST", { action: "remove", tableId: t.id });
  else await floor("POST", { tableId: t.id, is_running: false });
}
async function setSeats(t, taken, total) {
  await floor("POST", { action: "seats", tableId: t.id, seats_taken: taken, seats_total: total });
}

async function act(fn, okMsg) {
  if (state.busy) return;
  state.busy = true;
  try {
    await fn();
    await loadTables();
    if (okMsg) toast(okMsg);
  } catch (e) {
    toast(e.message || String(e));
  } finally {
    state.busy = false;
    render();
  }
}

// ── views ──
function renderLogin() {
  if (state.login === "password") {
    $app.innerHTML = `
      <div class="login">
      <img class="logo" src="logo.png" alt="Palms Poker" />
        <h2>Palms <span style="color:var(--goldText)">Floor</span></h2>
        <p>Sign in with your card number and your password.</p>
        <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="numeric" placeholder="Card number" />
        <input id="pass" type="password" autocomplete="current-password" placeholder="Password" />
        <button class="btn gold" id="go">Sign in</button>
        <button class="link" id="byCode">Sign in with an email code instead</button>
        <div class="err">${esc(state.err)}</div>
      </div>`;
    const user = document.getElementById("user"), pass = document.getElementById("pass"), go = document.getElementById("go");
    user.focus();
    [user, pass].forEach((i) => i.addEventListener("keydown", (e) => e.key === "Enter" && go.click()));
    document.getElementById("byCode").onclick = () => { state.login = "code"; state.step = "email"; state.err = ""; render(); };
    go.onclick = async () => {
      const u = user.value.trim();
      if (!u || !pass.value) return;
      go.disabled = true; state.err = "";
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: pw(pass.value) });
      if (error) { state.err = /invalid/i.test(error.message) ? "Wrong card number or password." : error.message; render(); }
    };
    return;
  }
  const code = state.step === "code";
  $app.innerHTML = `
    <div class="login">
      <img class="logo" src="logo.png" alt="Palms Poker" />
      <h2>Palms <span style="color:var(--goldText)">Floor</span></h2>
      <p>${code ? `Enter the 6-digit code sent to <b>${esc(state.email)}</b>.` : "Sign in with the email of your account in the app."}</p>
      ${code
        ? `<input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code" maxlength="10" />
           <button class="btn gold" id="go">Sign in</button>
           <button class="link" id="back">Use another email</button>`
        : `<input id="email" type="email" autocomplete="email" placeholder="Email" value="${esc(state.email)}" />
           <button class="btn gold" id="go">Send code</button>`}
      <button class="link" id="byPass">Sign in with card number and password</button>
      <div class="err">${esc(state.err)}</div>
    </div>`;
  const go = document.getElementById("go");
  const input = document.getElementById(code ? "code" : "email");
  input.focus();
  input.addEventListener("keydown", (e) => e.key === "Enter" && go.click());
  document.getElementById("byPass").onclick = () => { state.login = "password"; state.err = ""; render(); };
  if (code) document.getElementById("back").onclick = () => { state.step = "email"; state.err = ""; render(); };
  go.onclick = async () => {
    go.disabled = true; state.err = "";
    try {
      if (!code) {
        state.email = input.value.trim();
        // staff only: never creates an account
        const { error } = await sb.auth.signInWithOtp({ email: state.email, options: { shouldCreateUser: false } });
        if (error) throw error;
        state.step = "code";
      } else {
        const { error } = await sb.auth.verifyOtp({ email: state.email, token: input.value.trim(), type: "email" });
        if (error) throw error;
        return; // onAuthStateChange takes over
      }
    } catch (e) {
      state.err = /signups not allowed|not found/i.test(e.message) ? "This email has no account in the app." : e.message;
    }
    render();
  };
}

// ── Staff accounts (owner only): username + password for the other floor managers ──
async function loadStaff() {
  const { staff } = await floor("POST", { action: "staff-list", venueId: state.venue });
  state.staff = staff || [];
}

function renderStaff() {
  const list = state.staff || [];
  $app.innerHTML = `
    <header>
      <img class="logo" src="logo.png" alt="Palms Poker" />
      <h1>Palms <span>Floor</span> · Staff</h1>
      <div class="who"><button class="link" id="toCash">‹ Back to the tables</button></div>
    </header>
    <div class="grid">
      <div class="limit">
        <div class="lname">Floor accounts</div>
        <div class="tables">
          ${list.map((u) => `
            <div class="tbl" style="background:var(--card2);border-color:var(--border)" data-u="${esc(u.id)}">
              <div style="flex:1;min-width:0">
                <b>${esc(u.name || u.username)}</b>${u.owner ? ` <span class="hint">· owner</span>` : ""}${u.me ? ` <span class="hint">· you</span>` : ""}
                <div class="hint">${u.staff ? `Card ${esc(u.username)} · ` : ""}${u.last ? `last in ${new Date(u.last).toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" })}` : "never signed in"}</div>
              </div>
              ${u.staff && !u.owner ? `<button class="btn pw" title="Back to the card number backwards; they choose a new one at the next sign-in">Reset password</button><button class="btn danger rm">Remove</button>` : ""}
            </div>`).join("")}
        </div>
      </div>
      <div class="limit">
        <div class="lname">Add floor managers</div>
        <div class="hint">One per line: card number – full name. They sign in with the card number; the first password is the number backwards (1652 → 2561), then they choose their own.</div>
        <textarea id="bulk" rows="8" placeholder="1652 - Ani Raycheva&#10;48770 - Svetlin Tomov" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;resize:vertical"></textarea>
        <div class="row"><button class="btn gold" id="addStaff">Create accounts</button></div>
        <div class="err" id="staffErr"></div>
      </div>
    </div>`;
  document.getElementById("toCash").onclick = () => { state.view = "cash"; render(); };
  document.getElementById("addStaff").onclick = () => {
    const err = document.getElementById("staffErr");
    const lines = document.getElementById("bulk").value.split(/\n+/).map((l) => l.trim()).filter(Boolean);
    const people = [];
    for (const l of lines) {
      const m = l.match(/^(\d{2,12})\s*[-–—:,]?\s*(.+)$/);
      if (!m) return (err.textContent = `Can't read: "${l}" — write it as 1652 - Ani Raycheva`);
      people.push({ card: m[1].replace(/^0+/, ""), name: m[2].trim() });
    }
    if (!people.length) return (err.textContent = "Add at least one line.");
    staffAct(async () => {
      const done = [], failed = [];
      for (const p of people) {
        try {
          await floor("POST", { action: "staff-add", venueId: state.venue, username: p.card, name: p.name, password: pw(backwards(p.card)) });
          done.push(p.name);
        } catch (e) {
          failed.push(`${p.card} ${p.name}: ${e.message}`);
        }
      }
      if (failed.length) alert(`Created ${done.length}. Not created:\n${failed.join("\n")}`);
    }, `${people.length === 1 ? "Account" : "Accounts"} done`);
  };
  list.forEach((u) => {
    const el = document.querySelector(`[data-u="${u.id}"]`);
    el?.querySelector(".pw")?.addEventListener("click", () => {
      if (confirm(`Reset ${u.name || u.username}'s password to the card number backwards (${backwards(u.username)})? They choose a new one at the next sign-in.`))
        staffAct(() => floor("POST", { action: "staff-password", venueId: state.venue, userId: u.id, password: pw(backwards(u.username)) }), "Password reset");
    });
    el?.querySelector(".rm")?.addEventListener("click", () => {
      if (confirm(`Remove ${u.name || u.username}? They can no longer sign in.`))
        staffAct(() => floor("POST", { action: "staff-remove", venueId: state.venue, userId: u.id }), "Removed");
    });
  });
}

async function staffAct(fn, okMsg) {
  if (state.busy) return;
  state.busy = true;
  try { await fn(); await loadStaff(); toast(okMsg); }
  catch (e) { toast(e.message || String(e)); }
  finally { state.busy = false; render(); }
}

// The first sign-in (or after the owner reset it): the card number backwards
// is easy to guess, so each floor manager picks their own password once.
function renderFirstPassword() {
  $app.innerHTML = `
    <div class="login">
      <img class="logo" src="logo.png" alt="Palms Poker" />
      <h2>Welcome, ${esc(state.name)}</h2>
      <p>Choose your own password for the floor panel. You will use it from now on with your card number.</p>
      <input id="p1" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" />
      <input id="p2" type="password" autocomplete="new-password" placeholder="New password again" />
      <button class="btn gold" id="go">Save and continue</button>
      <button class="link" id="out">Sign out</button>
      <div class="err" id="fpErr"></div>
    </div>`;
  const p1 = document.getElementById("p1"), p2 = document.getElementById("p2"), go = document.getElementById("go");
  p1.focus();
  [p1, p2].forEach((i) => i.addEventListener("keydown", (e) => e.key === "Enter" && go.click()));
  document.getElementById("out").onclick = () => sb.auth.signOut();
  go.onclick = async () => {
    const err = document.getElementById("fpErr");
    const me = nameOf(state.session.user.email);
    if (p1.value.length < 6) return (err.textContent = "At least 6 characters.");
    if (p1.value !== p2.value) return (err.textContent = "The two passwords are not the same.");
    if (p1.value === backwards(me)) return (err.textContent = "Choose something other than your card number backwards.");
    go.disabled = true;
    const { error } = await sb.auth.updateUser({ password: pw(p1.value), data: { must_change: false } });
    if (error) { go.disabled = false; return (err.textContent = error.message); }
    state.mustChange = false;
    toast("Password saved");
    render();
  };
}

function renderNoAccess() {
  $app.innerHTML = `
    <div class="login">
      <img class="logo" src="logo.png" alt="Palms Poker" />
      <h2>No access</h2>
      <p>${esc(nameOf(state.session?.user?.email))} is not a floor admin. Ask Leo to add this account.</p>
      <button class="btn" id="out">Sign out</button>
    </div>`;
  document.getElementById("out").onclick = () => sb.auth.signOut();
}

function renderPanel() {
  const gs = groups();
  const open = state.tables.filter((t) => t.is_running);
  const seated = open.reduce((a, t) => a + (t.seats_taken || 0), 0);
  const free = open.reduce((a, t) => a + (t.seats_total != null ? Math.max(0, t.seats_total - (t.seats_taken || 0)) : 0), 0);
  const venueName = state.venue.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

  $app.innerHTML = `
    <header>
      <img class="logo" src="logo.png" alt="Palms Poker" />
      <h1>Palms <span>Floor</span> · Cash</h1>
      <div class="who"><b style="color:var(--text)">Welcome, ${esc(state.name)}</b><br>${esc(venueName)} · ${state.owner ? `<button class="link" id="toStaff">Staff</button> · ` : ""}<button class="link" id="out">Sign out</button></div>
    </header>
    <div class="stats">
      <div class="stat"><small>Open tables</small><b>${open.length}</b></div>
      <div class="stat"><small>Players</small><b>${seated}</b></div>
      <div class="stat"><small>Free seats</small><b>${free}</b></div>
    </div>
    <div class="grid">
      ${gs.map((g, gi) => limitCard(g, gi)).join("")}
      ${state.limitForm ? limitFormCard() : `<button class="add" id="addLimit">+ Add limit</button>`}
    </div>
    <div class="updated">Updated ${state.loadedAt ? state.loadedAt.toLocaleTimeString("en-GB") : "—"} · refreshes every 10 s · players see changes at once</div>`;

  document.getElementById("out").onclick = () => sb.auth.signOut();
  const toStaff = document.getElementById("toStaff");
  if (toStaff) toStaff.onclick = async () => {
    state.view = "staff";
    try { await loadStaff(); } catch (e) { toast(e.message); }
    render();
  };
  const addL = document.getElementById("addLimit");
  if (addL) addL.onclick = () => { state.limitForm = true; render(); };
  bindLimitForm();

  gs.forEach((g, gi) => {
    const card = document.querySelector(`[data-g="${gi}"]`);
    card.querySelector(".openBtn")?.addEventListener("click", () => { state.openForm = gi; render(); });
    card.querySelector(".del")?.addEventListener("click", () => {
      if (g.open.length) return toast("Close this limit's open tables first.");
      if (!confirm(`Remove ${limitName(g.sample)} from the floor panel?`)) return;
      act(() => floor("POST", { action: "remove-limit", tableId: g.sample.id }), "Limit removed");
    });
    g.open.forEach((t) => {
      const el = card.querySelector(`[data-t="${t.id}"]`);
      const total = t.seats_total ?? DEFAULT_SEATS;
      const taken = t.seats_taken ?? 0;
      el.querySelector(".minus").onclick = () => taken > 0 && act(() => setSeats(t, taken - 1, total));
      el.querySelector(".plus").onclick = () => taken < total && act(() => setSeats(t, taken + 1, total));
      el.querySelector(".max").onchange = (e) => {
        const n = Number(e.target.value);
        act(() => setSeats(t, Math.min(taken, n), n));
      };
      el.querySelector(".close").onclick = () => {
        if (confirm(`Close table ${t.table_no}?`)) act(() => closeTable(t), `Table ${t.table_no} closed`);
      };
    });
    if (state.openForm === gi) {
      const f = card.querySelector(".form");
      const no = f.querySelector(".no"), pl = f.querySelector(".pl"), mx = f.querySelector(".mx");
      no.focus();
      const submit = () => {
        const n = parseInt(no.value, 10), p = parseInt(pl.value || "0", 10), m = Number(mx.value);
        const err = f.querySelector(".err");
        if (!n) return (err.textContent = "Enter the table number.");
        if (p < 0 || p > m) return (err.textContent = `Players must be 0–${m}.`);
        state.openForm = null;
        act(() => openTable(g.sample.id, n, p, m), `Table ${n} opened`);
      };
      [no, pl].forEach((i) => i.addEventListener("keydown", (e) => e.key === "Enter" && submit()));
      f.querySelector(".ok").onclick = submit;
      f.querySelector(".cancel").onclick = () => { state.openForm = null; render(); };
    }
  });
}

function limitCard(g, gi) {
  const t0 = g.sample;
  const open = [...g.open].sort((a, b) => a.table_no - b.table_no);
  return `
    <div class="limit ${open.length ? "live" : ""}" data-g="${gi}">
      <div class="lhead">
        <span class="lname">${esc(limitName(t0))}</span>
        <span class="lmeta">${esc(buyin(t0))}</span>
        <button class="del" title="Remove limit">×</button>
      </div>
      ${open.length ? `<div class="tables">${open.map(tableRow).join("")}</div>` : `<div class="closedNote">No table open</div>`}
      ${state.openForm === gi ? openFormHtml() : `<div><button class="btn gold openBtn">+ Open table</button></div>`}
    </div>`;
}

function tableRow(t) {
  const total = t.seats_total ?? DEFAULT_SEATS;
  const taken = t.seats_taken ?? 0;
  return `
    <div class="tbl" data-t="${t.id}">
      <div class="tno"><small>OPEN</small>T${t.table_no}</div>
      <div class="seats">
        <button class="round minus" title="One player less">−</button>
        <b>${taken}/${total}</b>
        <button class="round plus" title="One player more">+</button>
      </div>
      <select class="max" title="Seats at the table">
        ${[6, 7, 8, 9, 10].map((n) => `<option value="${n}" ${n === total ? "selected" : ""}>${n}-max</option>`).join("")}
      </select>
      <button class="btn danger close">Close</button>
    </div>`;
}

function openFormHtml() {
  return `
    <div class="form">
      <div class="row">
        <input class="no w90" inputmode="numeric" placeholder="Table no." />
        <input class="pl w90" inputmode="numeric" placeholder="Players" />
        <select class="mx">${[6, 7, 8, 9, 10].map((n) => `<option value="${n}" ${n === DEFAULT_SEATS ? "selected" : ""}>${n}-max</option>`).join("")}</select>
      </div>
      <div class="row">
        <button class="btn gold ok">Open</button>
        <button class="btn cancel">Cancel</button>
      </div>
      <div class="err"></div>
    </div>`;
}

function limitFormCard() {
  return `
    <div class="limit" id="lf">
      <div class="lname">New limit</div>
      <div class="row">
        <select id="lfGame"><option>NLH</option><option>PLO</option><option>MIX</option></select>
        <input id="lfSb" class="w70" inputmode="decimal" placeholder="SB" />
        <input id="lfBb" class="w70" inputmode="decimal" placeholder="BB" />
      </div>
      <div class="row">
        <input id="lfMin" class="w120" inputmode="numeric" placeholder="Min buy-in" />
        <input id="lfMax" class="w120" inputmode="numeric" placeholder="Max (empty = none)" />
      </div>
      <div class="row">
        <input id="lfRake" class="w90" inputmode="decimal" placeholder="Rake %" />
        <input id="lfCap" class="w90" inputmode="decimal" placeholder="Rake cap" />
      </div>
      <div class="row">
        <button class="btn gold" id="lfSave">Save limit</button>
        <button class="btn" id="lfCancel">Cancel</button>
      </div>
      <div class="err" id="lfErr"></div>
      <div class="hint">A new limit starts closed — open its tables with “+ Open table”.</div>
    </div>`;
}

function bindLimitForm() {
  if (!state.limitForm) return;
  const v = (id) => document.getElementById(id).value.trim();
  const n = (id) => { const x = parseFloat(v(id).replace(",", ".")); return x > 0 ? x : null; };
  document.getElementById("lfCancel").onclick = () => { state.limitForm = false; render(); };
  document.getElementById("lfSave").onclick = () => {
    const sbv = n("lfSb"), bbv = n("lfBb");
    if (!sbv || !bbv || bbv < sbv) return (document.getElementById("lfErr").textContent = "Check the blinds — big blind must be ≥ small blind.");
    state.limitForm = false;
    act(() => floor("POST", { action: "add-limit", venueId: state.venue, game: v("lfGame"), sb: sbv, bb: bbv,
      min_buyin: n("lfMin"), max_buyin: n("lfMax"), rake_pct: n("lfRake"), rake_cap: n("lfCap") }), "Limit added");
  };
}

function render() {
  if (!state.session) return renderLogin();
  if (!state.venue) return renderNoAccess();
  if (state.mustChange) return renderFirstPassword();
  if (state.view === "staff" && state.owner) return renderStaff();
  // keep typing intact: no full re-render while a form is being filled in
  renderPanel();
}

async function start(session) {
  state.session = session;
  if (!session) { state.venue = null; state.owner = false; state.step = "email"; state.login = "password"; return render(); }
  $app.innerHTML = `<div class="updated">Loading…</div>`;
  try {
    const { venues, owner, name, mustChange } = await floor("GET");
    state.name = name || nameOf(session.user.email);
    state.mustChange = !!mustChange;
    state.venues = venues || [];
    state.venue = state.venues.includes("palms-royale-sofia") ? "palms-royale-sofia" : state.venues[0] || null;
    state.owner = !!state.venue && (owner || []).includes(state.venue);
    state.view = "cash";
    if (state.venue) await loadTables();
  } catch (e) {
    toast(e.message);
  }
  render();
}

// a new sign-in or sign-out reloads; a silent token refresh only swaps the session
sb.auth.onAuthStateChange((_e, session) => {
  if ((session?.user?.id || null) !== (state.session?.user?.id || null)) start(session);
  else state.session = session;
});
sb.auth.getSession().then(({ data }) => start(data.session));

// live: other staff (or the app) change tables too
setInterval(async () => {
  if (!state.venue || state.view !== "cash" || state.busy || state.openForm !== null || state.limitForm || document.activeElement?.tagName === "INPUT") return;
  try { await loadTables(); render(); } catch {}
}, 10000);
</script>
</body>
</html>
