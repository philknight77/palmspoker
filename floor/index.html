<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Palms Floor</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<!--
  Palms Poker · floor panel for the cash games (Leo, 23.11) — the web twin of
  the app's "⚙ Floor panel": open and close tables, players per table, limits.
  Same Supabase project, same `floor` Edge Function, same rules: sign in with
  the staff account (email code), and only venue_admins can change anything.
  The anon key below is the public one the app ships with.
-->
<style>
  /* Dark dashboard (Leo, 23.11 — after the "Fitness Tracker Dashboard, dark"
     shot on Dribbble): near-black ground, soft dark cards, pastel cards with
     dark ink for what matters, pill navigation, round icon buttons. */
  :root {
    --bg: #0e0e10; --panel: #17171a; --card: #1e1e22; --card2: #27272c; --border: rgba(255,255,255,.07);
    --text: #f4f4f5; --sec: #a1a1aa; --muted: #6b6b75; --ink: #121215;
    --pink: #f5c2e7; --blue: #cfe1f9; --lime: #e2f5b8; --peach: #fdd9bd; --lav: #dcd4ff; --mint: #c9f1df; --sun: #fbe9a6;
    --gold: #f5c2e7; --goldText: #f5c2e7; --onGold: #121215;
    --open: #86efac; --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; }
  .wrap { max-width: 1760px; margin: 0 auto; padding: 18px 24px 48px; }
  .link { background: none; border: 0; color: var(--pink); cursor: pointer; padding: 0; font-weight: 600; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .topbar .logo { width: 44px; height: 44px; flex: none; }
  .nav { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--border); padding: 5px; border-radius: 999px; }
  .pill { border: 0; background: transparent; color: var(--sec); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 7px; }
  .pill:hover { color: var(--text); }
  .pill.on { background: var(--pink); color: var(--ink); }
  .pill svg { width: 15px; height: 15px; }
  .tright { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .hello { text-align: right; line-height: 1.25; }
  .hello b { display: block; font-size: 14px; }
  .hello span { color: var(--sec); font-size: 12px; }
  .iconBtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .iconBtn:hover { background: var(--card2); }
  .iconBtn svg { width: 18px; height: 18px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--text); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }

  /* the dashboard grid */
  .dash { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px; }
  .cardHead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .cardHead h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .cardHead span { color: var(--muted); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .kpi { border-radius: 22px; padding: 18px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; }
  .kpi small { font-size: 12px; font-weight: 700; opacity: .75; }
  .kpi b { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .kpi em { font-style: normal; font-size: 12px; opacity: .7; }
  .kpi.pink { background: var(--pink); color: var(--ink); }
  .kpi.blue { background: var(--blue); color: var(--ink); }
  .kpi.dark { background: var(--card); border: 1px solid var(--border); }
  .bar { height: 8px; border-radius: 999px; background: var(--card2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--lime); }

  /* tables 1–30 */
  .room { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  /* a poker table seen from above (Leo, 23.11): an oval of felt inside a rail */
  .ptable { position: relative; border: 7px solid #2c2c33; border-radius: 999px; aspect-ratio: 2 / 1; background: radial-gradient(ellipse at 50% 35%, #2a2a31, #1b1b20);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), 0 6px 14px rgba(0,0,0,.35); color: var(--muted); cursor: pointer;
    padding: 6px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
    transition: transform .12s ease, border-color .12s ease; }
  .ptable:hover { transform: translateY(-2px); border-color: #3a3a43; }
  .ptable .pno { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -.5px; }
  .ptable .pgame { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .ptable .pfoot { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ptable .pseats { font-size: 12px; font-weight: 800; }
  .ptable .popen { display: none; }
  .ptable.on { color: var(--ink); border-color: #3b3b44; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), inset 0 -10px 24px rgba(0,0,0,.12), 0 8px 18px rgba(0,0,0,.4); }
  .ptable.on .pgame { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .ptable.on:hover { border-color: #4a4a55; }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .45; }
  .dots i.f { background: currentColor; opacity: .9; }
  .full .pseats::after { content: " full"; font-weight: 700; }

  /* right column */
  .ringWrap { display: flex; align-items: center; gap: 18px; }
  .ring { width: 118px; height: 118px; flex: none; }
  .ring text { fill: var(--text); font-weight: 800; }
  .ringInfo b { font-size: 20px; display: block; }
  .ringInfo span { color: var(--sec); font-size: 12px; }
  .live { display: flex; flex-direction: column; gap: 10px; }
  .liveRow { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--card2); }
  .swatch { width: 38px; height: 38px; border-radius: 12px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); font-weight: 800; font-size: 13px; }
  .liveRow b { display: block; font-size: 13px; }
  .liveRow span { color: var(--sec); font-size: 12px; }
  .liveRow .num { margin-left: auto; font-weight: 800; font-size: 16px; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .updated { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: center; }

  /* limits page */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 16px; }
  .limit { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .lname { font-size: 17px; font-weight: 800; }
  .lrow { display: flex; align-items: center; gap: 12px; }
  .lrow .del { margin-left: auto; }
  .tables { display: flex; flex-direction: column; gap: 8px; }
  .tbl { display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 14px; padding: 10px 12px; flex-wrap: wrap; }

  /* buttons and inputs */
  .btn { border: 1px solid var(--border); background: var(--card2); color: var(--text); border-radius: 12px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
  .btn:hover { background: #33333a; }
  .btn.gold { background: var(--pink); border-color: var(--pink); color: var(--ink); }
  .btn.gold:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--pink); outline-offset: -1px; }
  .w70 { width: 76px; } .w90 { width: 96px; } .w120 { width: 140px; }
  .form { background: var(--card2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .err { color: var(--danger); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; }

  /* sign in */
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 26px; padding: 26px; display: flex; flex-direction: column; gap: 12px; }
  .login .logo { width: 92px; height: 92px; align-self: center; margin-bottom: 4px; }
  .login h2 { margin: 0; font-size: 22px; }
  .login h2 span { color: var(--pink) !important; }
  .login p { margin: 0; color: var(--sec); font-size: 14px; }
  .login input { width: 100%; font-size: 16px; padding: 13px 14px; }
  .login .btn { padding: 13px; font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--ink); font-weight: 600; padding: 10px 18px; border-radius: 999px; font-size: 14px; display: none; max-width: calc(100% - 32px); z-index: 60; }

  /* the window over a table */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { width: 100%; max-width: 540px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .mhead { display: flex; align-items: center; gap: 10px; }
  .mtitle { font-size: 19px; font-weight: 800; }
  .openTag { font-size: 11px; color: var(--ink); background: var(--open); border-radius: 999px; padding: 2px 8px; vertical-align: middle; margin-left: 6px; font-weight: 800; }
  .mclose { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--sec); font-size: 20px; cursor: pointer; line-height: 1; }
  .mgame { font-size: 17px; font-weight: 800; }
  .mlabel { color: var(--sec); font-size: 11px; font-weight: 700; margin-top: 2px; }
  .games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .gameBtn { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 7px 9px; cursor: pointer; font-weight: 700; font-size: 12px; text-align: left; display: flex; gap: 8px; align-items: center; line-height: 1.25; }
  .gameBtn small { display: block; color: var(--sec); font-weight: 500; font-size: 10px; }
  .gameBtn .gdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .gameBtn.on { outline: 2px solid var(--pink); background: var(--card2); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card2); color: var(--text); cursor: pointer; font-size: 18px; font-weight: 800; }
  .round.big { width: 44px; height: 44px; font-size: 22px; }
  .round:hover { background: #33333a; }
  .bigNum { font-size: 34px; font-weight: 800; min-width: 80px; text-align: center; letter-spacing: -1px; }
  .bigNum small { font-size: 18px; color: var(--sec); }
  .maxBtn { background: transparent; border: 1px solid var(--border); color: var(--sec); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-weight: 700; font-size: 12px; }
  .maxBtn.on { background: var(--text); color: var(--ink); border-color: var(--text); }
  .wide { width: 100%; padding: 11px; font-size: 15px; }

  /* the intro after signing in */
  .intro { position: fixed; inset: 0; z-index: 50; background: radial-gradient(ellipse at 50% 40%, #1c1c21, #0b0b0d 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; cursor: pointer; transition: opacity .45s ease; }
  .intro.out { opacity: 0; }
  .introLogo { width: min(220px, 48vw); height: auto; animation: introLogo .9s cubic-bezier(.2,.8,.2,1) both; filter: drop-shadow(0 0 28px rgba(242,193,78,.3)); }
  @keyframes introLogo { from { opacity: 0; transform: scale(.7) rotate(-20deg); } to { opacity: 1; transform: none; } }
  .introText { min-height: 1.3em; font-size: clamp(24px, 4.2vw, 46px); font-weight: 800; letter-spacing: -.5px; text-align: center; padding: 0 16px; }
  .introText .typed { background: linear-gradient(90deg, #fff, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .caret { display: inline-block; width: 3px; height: 1em; margin-left: 4px; vertical-align: -0.12em; background: var(--pink); animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (min-width: 1500px) {
    .ptable .pno { font-size: 32px; }
  }
  @media (max-width: 1180px) {
    .dash { grid-template-columns: 1fr; }
    .room { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .wrap { padding: 12px 12px 40px; }
    .topbar { flex-wrap: wrap; gap: 10px; }
    .nav { order: 3; width: 100%; justify-content: space-between; }
    .pill { padding: 8px 10px; }
    .hello { display: none; }
    .kpis { gap: 10px; }
    .kpi { padding: 14px; min-height: 96px; border-radius: 18px; }
    .kpi b { font-size: 30px; }
    .room { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .ptable { border-width: 5px; aspect-ratio: 1.6 / 1; padding: 4px 6px; }
    .ptable .pno { font-size: 22px; }
    .ptable.on .pgame { font-size: 10px; }
    .dots { display: none; }
    .games { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* a computer screen: the tables page fits the window, nothing to scroll
     (Leo, 23.11) — the tables share whatever height is left */
  @media (min-width: 1000px) and (min-height: 560px) {
    .wrap.fit { height: 100vh; display: flex; flex-direction: column; padding: 14px 22px 8px; }
    .fit .topbar { flex: none; margin-bottom: 12px; }
    .fit .dash { flex: 1; min-height: 0; align-items: stretch; }
    .fit .dash > .col { min-height: 0; }
    .fit .dash > .col:first-child > .card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px; }
    .fit .cardHead { margin-bottom: 10px; }
    .fit .kpis { flex: none; }
    .fit .kpi { min-height: 0; padding: 12px 18px; gap: 4px; }
    .fit .kpi b { font-size: clamp(26px, 4.2vh, 40px); }
    .fit .room { flex: 1; min-height: 0; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); gap: clamp(6px, 1.2vh, 12px); }
    .fit .ptable { aspect-ratio: auto; height: 100%; min-height: 0; border-width: clamp(4px, .8vh, 7px); padding: 2px 10px; gap: 1px; }
    .fit .ptable .pno { font-size: clamp(16px, 3.4vh, 32px); }
    .fit .ptable .pgame { font-size: clamp(9px, 1.4vh, 12px); }
    .fit .ptable .pseats { font-size: clamp(10px, 1.5vh, 13px); }
    .fit .dots i { width: clamp(4px, .7vh, 6px); height: clamp(4px, .7vh, 6px); }
    .fit .dash > .col:last-child > .card:last-child { flex: 1; min-height: 0; overflow: auto; }
    .fit .ring { width: clamp(80px, 14vh, 118px); height: clamp(80px, 14vh, 118px); }
    .fit .updated { flex: none; margin-top: 6px; }
  }
  /* thin dark scrollbars (the Live games list when many games run) */
  * { scrollbar-width: thin; scrollbar-color: #3a3a42 transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (min-width: 1000px) and (max-height: 760px) {
    .fit .dots { display: none; }
  }

  /* tournament tables (seating from PokerLens): gold rail, deep felt */
  :root { --goldT: #f2c14e; }
  .ptable.tour { color: #fff; border-color: #b8892a; background: radial-gradient(ellipse at 50% 30%, #4a3a8a, #241a55);
    box-shadow: inset 0 0 0 2px rgba(242,193,78,.35), 0 8px 18px rgba(0,0,0,.4); }
  .ptable.tour:hover { border-color: var(--goldT); }
  .ptable .ptag { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--goldT); }
  .ptable .pname { font-size: 11px; font-weight: 700; line-height: 1.15; max-width: 92%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ptable.tour .pseats { color: var(--goldT); }
  .tourSw { background: linear-gradient(135deg, #4a3a8a, #241a55); color: var(--goldT) !important; border: 1px solid #b8892a; }
  .roomTotal { margin-top: 4px; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--border); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .roomTotal b { font-size: 20px; }
  .roomTotal span { color: var(--sec); font-size: 12px; }
  @media (min-width: 1000px) and (min-height: 560px) {
    .fit .ptable .pname { font-size: clamp(9px, 1.3vh, 11px); }
    .fit .ptable .ptag { font-size: clamp(7px, 1vh, 9px); }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://kbpzqlkqorwstwdccsja.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImticHpxbGtxb3J3c3R3ZGNjc2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjc1ODYsImV4cCI6MjA5ODk0MzU4Nn0.gYmjX4Uuv0RrGOePN8Gkk05uOWfos2EK0_7PDGM9bPE";
const DEFAULT_SEATS = 8; // our tables are 8-max, as in the app
const CUR = "€";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let state = { session: null, venues: [], venue: null, owner: false, tables: [], step: "email", email: "", busy: false,
  modal: null, limitForm: false, err: "", loadedAt: null,
  login: "password", // floor staff: username + password; the owner can use an email code
  view: "cash", staff: null, name: "", mustChange: false };
// staff accounts' made-up addresses (supabase/floor_staff.sql)
const STAFF_DOMAIN = "staff.palmspoker.invalid";
// a card number signs in as typed, leading zeros or not ("01652" = "1652")
const toEmail = (u) => (u.includes("@") ? u : `${(/^\d+$/.test(u) ? u.replace(/^0+/, "") : u).toLowerCase()}@${STAFF_DOMAIN}`);
// Supabase wants 6+ characters and Leo's first passwords are 4 digits (the
// card number backwards), so the panel puts this in front of whatever is typed.
const PW_PREFIX = "palms-floor:";
const pw = (typed) => PW_PREFIX + typed;
const backwards = (n) => String(n).split("").reverse().join("");
const nameOf = (email) => ((email || "").endsWith("@" + STAFF_DOMAIN) ? email.split("@")[0] : email);

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500);
}

async function floor(method, body) {
  const { data } = await sb.auth.getSession();
  const token = data.session?.access_token;
  if (!token) throw new Error("Not signed in");
  const res = await fetch(`${SUPABASE_URL}/functions/v1/floor`, {
    method,
    headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const p = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(p.error || `Request failed (${res.status})`);
  return p;
}

const limitKey = (t) => `${t.game}|${t.sb}|${t.bb}`;
// a Bomb Pot has one blind, an ante for everyone: "BOMB POT €5 ante"
const limitName = (t) => (/bomb/i.test(t.game) ? `${t.game} ${CUR}${t.bb} ante` : `${t.game} ${CUR}${t.sb}/${CUR}${t.bb}`);
const rake = (t) => t.rake_pct != null ? `Rake ${t.rake_pct}%${t.rake_cap != null ? ` cap ${CUR}${t.rake_cap}` : ""}` : t.rake_cap != null ? `Rake ${CUR}${t.rake_cap}` : "";
const buyin = (t) => [t.min_buyin ? `Buy-in ${CUR}${t.min_buyin}${t.max_buyin ? `–${CUR}${t.max_buyin}` : "+"}` : "", rake(t)].filter(Boolean).join(" · ");

async function loadTables() {
  const [cash, tour] = await Promise.all([
    sb.from("cash_tables").select("*").eq("venue_id", state.venue).order("bb").order("table_no"),
    // tournaments in play right now: their seating comes from PokerLens (players[].t)
    sb.from("tournament_live").select("id, name, status, entries, players_left, players")
      .eq("venue_id", state.venue).in("status", ["running", "paused"]),
  ]);
  if (cash.error) throw cash.error;
  state.tables = cash.data || [];
  state.tourneys = (tour.data || []).map((r) => {
    const byTable = new Map();
    for (const p of r.players || []) if (!p.b && p.t != null) byTable.set(Number(p.t), (byTable.get(Number(p.t)) || 0) + 1);
    return { id: r.id, name: r.name, status: r.status, entries: r.entries || 0, left: r.players_left || 0, byTable };
  });
  state.loadedAt = new Date();
}

// the tournament playing at a table, and how many of its players sit there
function tourneyAt(no) {
  for (const t of state.tourneys || []) if (t.byTable.has(no)) return { t, count: t.byTable.get(no) };
  return null;
}
// "Bwin Legends Main Event Day 1A" fits a table: the room's own series prefix stays
const shortName = (n) => String(n || "").replace(/\s*\(.*?\)\s*/g, " ").trim();

function groups() {
  const m = new Map();
  for (const t of state.tables) {
    const k = limitKey(t);
    const g = m.get(k) || { sample: t, open: [], rows: [] };
    g.rows.push(t);
    if (t.is_running) g.open.push(t);
    m.set(k, g);
  }
  return [...m.values()].sort((a, b) => a.sample.bb - b.sample.bb || a.sample.sb - b.sample.sb || a.sample.game.localeCompare(b.sample.game));
}

// ── actions (the same rules as the app's floor panel) ──
async function openTable(sampleId, no, taken, total) {
  const { table } = await floor("POST", { action: "add", fromTableId: sampleId, tableNo: no });
  await floor("POST", { action: "seats", tableId: table.id, seats_taken: taken, seats_total: total });
}
async function closeTable(t) {
  const same = state.tables.filter((x) => limitKey(x) === limitKey(t));
  // the last row of a limit stays as its template, just switched off
  if (same.length > 1) await floor("POST", { action: "remove", tableId: t.id });
  else await floor("POST", { tableId: t.id, is_running: false });
}
async function setSeats(t, taken, total) {
  await floor("POST", { action: "seats", tableId: t.id, seats_taken: taken, seats_total: total });
}

async function act(fn, okMsg) {
  if (state.busy) return;
  state.busy = true;
  try {
    await fn();
    await loadTables();
    if (okMsg) toast(okMsg);
  } catch (e) {
    toast(e.message || String(e));
  } finally {
    state.busy = false;
    render();
  }
}

// ── The room (Leo, 23.11): tables 1–30 as in the hall. Tap a closed one to
// open it (game + players), tap an open one to change the players or close it.
const TABLE_COUNT = 30;

const runningAt = (no) => state.tables.find((t) => t.is_running && t.table_no === no);

// open table `no` with limit group g: the same row comes back on if this
// table had that game before, otherwise a new row (the floor function's "add")
async function openTableAt(no, g, taken, total) {
  if (runningAt(no)) throw new Error(`Table ${no} is already open`);
  const before = g.rows.find((t) => !t.is_running && t.table_no === no);
  let id;
  if (before) {
    await floor("POST", { tableId: before.id, is_running: true });
    id = before.id;
  } else {
    const { table } = await floor("POST", { action: "add", fromTableId: g.sample.id, tableNo: no });
    id = table.id;
  }
  await floor("POST", { action: "seats", tableId: id, seats_taken: taken, seats_total: total });
}

function dots(taken, total) {
  return `<span class="dots">${Array.from({ length: total }, (_, i) => `<i class="${i < taken ? "f" : ""}"></i>`).join("")}</span>`;
}

function ring(pct) {
  const r = 48, c = 2 * Math.PI * r, off = c * (1 - pct);
  return `<svg class="ring" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--card2)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--lime)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="22">${Math.round(pct * 100)}%</text>
  </svg>`;
}

  const gs = groups();
  $app.innerHTML = `
    ${topbar("limits")}
    <div class="grid">
      ${gs.map((g, gi) => `
        <div class="limit">
          <div class="lrow">
            <span class="swatch" style="background:${colorOf(g.sample, gs)}">${g.open.length || ""}</span>
            <div><div class="lname">${esc(limitName(g.sample))}</div><div class="hint">${esc(buyin(g.sample)) || "&nbsp;"}</div></div>
            <button class="btn danger del" data-rm="${gi}">Remove</button>
          </div>
          <div class="hint">${g.open.length ? `Open now: ${g.open.map((t) => "T" + t.table_no).join(", ")}` : "No table open"}</div>
        </div>`).join("")}
      ${state.limitForm ? limitFormCard() : `<button class="limit" id="addLimit" style="align-items:center;justify-content:center;cursor:pointer;color:var(--pink);font-weight:800;border-style:dashed;min-height:110px">+ Add limit</button>`}
    </div>`;
  bindTopbar();
  const addL = document.getElementById("addLimit");
  if (addL) addL.onclick = () => { state.limitForm = true; render(); };
  bindLimitForm();
  document.querySelectorAll("[data-rm]").forEach((b) => {
    const g = gs[Number(b.dataset.rm)];
    b.onclick = () => {
      if (g.open.length) return toast(`Close the ${limitName(g.sample)} tables first.`);
      if (!confirm(`Remove ${limitName(g.sample)}?`)) return;
      act(() => floor("POST", { action: "remove-limit", tableId: g.sample.id }), "Limit removed");
    };
  });
}

function stepper(taken, total) {
  return `<div class="stepper">
      <button class="round big minus" title="One player less">−</button>
      <b class="bigNum">${taken}<small>/${total}</small></b>
      <button class="round big plus" title="One player more">+</button>
    </div>
    <div class="row" style="justify-content:center">
      ${[6, 7, 8, 9, 10].map((n) => `<button class="maxBtn ${n === total ? "on" : ""}" data-max="${n}">${n}-max</button>`).join("")}
    </div>`;
}

function gameChips(gs, selectedKey, all) {
  if (!gs.length) return `<div class="hint">No games yet — add one under Limits.</div>`;
  return `<div class="games">${gs.map((g) => {
    const k = limitKey(g.sample);
    return `<button class="gameBtn ${k === selectedKey ? "on" : ""}" data-key="${esc(k)}"><span class="gdot" style="background:${colorOf(g.sample, all || gs)}"></span><span>${esc(limitName(g.sample))}<small>${esc(buyin(g.sample))}</small></span></button>`;
  }).join("")}</div>`;
}

function modalHtml(gs) {
  const m = state.modal;
  if (m.tour) {
    const tr = tourneyAt(m.no);
    if (!tr) { state.modal = null; return ""; }
    return `<div class="overlay"><div class="modal">
      <div class="mhead"><span class="swatch tourSw">${m.no}</span><div class="mtitle">Table ${m.no} <span class="openTag" style="background:var(--goldT)">TOURNAMENT</span></div><button class="mclose" title="Close">×</button></div>
      <div class="mgame">${esc(tr.t.name)}</div>
      <div class="hint">${tr.count} player${tr.count === 1 ? "" : "s"} at this table · ${tr.t.left} / ${tr.t.entries} in the tournament</div>
      <div class="hint">The tournament's tables come from the tournament clock (kHold'em / PokerLens) — they free up by themselves when the table breaks.</div>
    </div></div>`;
  }
  const t = runningAt(m.no);
  if (!t) {
    return `<div class="overlay"><div class="modal">
      <div class="mhead"><div class="mtitle">Table ${m.no}</div><button class="mclose" title="Close">×</button></div>
      <div class="mlabel">Game</div>
      ${gameChips(gs, m.key)}
      <div class="mlabel">Players at the table</div>
      ${stepper(m.taken, m.total)}
      <button class="btn gold wide" id="mOpen" ${m.key ? "" : "disabled"}>Open table ${m.no}</button>
    </div></div>`;
  }
  const total = t.seats_total ?? DEFAULT_SEATS, taken = t.seats_taken ?? 0;
  return `<div class="overlay"><div class="modal">
    <div class="mhead"><span class="swatch" style="background:${colorOf(t, gs)}">${m.no}</span><div class="mtitle">Table ${m.no} <span class="openTag">OPEN</span></div><button class="mclose" title="Close">×</button></div>
    <div class="mgame">${esc(limitName(t))} <span class="hint">${esc(buyin(t))}</span></div>
    <div class="mlabel">Players at the table</div>
    ${stepper(taken, total)}
    ${m.change
      ? `<div class="mlabel">Switch to</div>${gameChips(gs.filter((g) => limitKey(g.sample) !== limitKey(t)), m.key, gs)}
         <div class="row"><button class="btn gold" id="mSwitch" ${m.key ? "" : "disabled"}>Switch game</button><button class="btn" id="mNoSwitch">Cancel</button></div>`
      : `<button class="link" id="mChange" style="align-self:center">Change the game…</button>`}
    ${m.confirmClose
      ? `<div class="row" style="justify-content:center"><span>Close table ${m.no}?</span><button class="btn danger" id="mCloseYes">Yes, close it</button><button class="btn" id="mCloseNo">No</button></div>`
      : `<button class="btn danger wide" id="mClose">Close table ${m.no}</button>`}
  </div></div>`;
}

function bindModal(gs) {
  const m = state.modal;
  // look only inside the window: the room behind it has look-alike class names
  // ("+ open" on a closed table took the + button's clicks, 23.11)
  const M = document.querySelector(".modal");
  const one = (sel) => M.querySelector(sel);
  const all = (sel) => M.querySelectorAll(sel);
  const shut = () => { state.modal = null; render(); };
  one(".mclose").onclick = shut;
  document.querySelector(".overlay").onclick = (e) => e.target.classList.contains("overlay") && shut();
  if (m.tour) return;
  const t = runningAt(m.no);
  all(".gameBtn").forEach((b) => (b.onclick = () => { m.key = b.dataset.key; render(); }));
  const groupOf = (key) => gs.find((g) => limitKey(g.sample) === key);

  if (!t) {
    one(".minus").onclick = () => { m.taken = Math.max(0, m.taken - 1); render(); };
    one(".plus").onclick = () => { m.taken = Math.min(m.total, m.taken + 1); render(); };
    all(".maxBtn").forEach((b) => (b.onclick = () => { m.total = Number(b.dataset.max); m.taken = Math.min(m.taken, m.total); render(); }));
    one("#mOpen").onclick = () => {
      const g = groupOf(m.key);
      if (!g) return;
      const { no, taken, total } = m;
      state.modal = null;
      act(() => openTableAt(no, g, taken, total), `Table ${no} opened · ${limitName(g.sample)}`);
    };
    return;
  }
  const total = t.seats_total ?? DEFAULT_SEATS, taken = t.seats_taken ?? 0;
  // the players change at once, the window stays open
  one(".minus").onclick = () => taken > 0 && act(() => setSeats(t, taken - 1, total));
  one(".plus").onclick = () => taken < total && act(() => setSeats(t, taken + 1, total));
  all(".maxBtn").forEach((b) => (b.onclick = () => {
    const n = Number(b.dataset.max);
    act(() => setSeats(t, Math.min(taken, n), n));
  }));
  const ch = one("#mChange");
  if (ch) ch.onclick = () => { m.change = true; m.key = null; render(); };
  const ns = one("#mNoSwitch");
  if (ns) ns.onclick = () => { m.change = false; render(); };
  const sw = one("#mSwitch");
  if (sw) sw.onclick = () => {
    const g = groupOf(m.key);
    if (!g) return;
    m.change = false;
    // close it under the old game, open it again under the new one, same players
    act(async () => { await closeTable(t); await loadTables(); await openTableAt(m.no, groups().find((x) => limitKey(x.sample) === m.key) || g, taken, total); },
      `Table ${m.no} · ${limitName(g.sample)}`);
  };
  const c = one("#mClose");
  if (c) c.onclick = () => { m.confirmClose = true; render(); };
  const cn = one("#mCloseNo");
  if (cn) cn.onclick = () => { m.confirmClose = false; render(); };
  const cy = one("#mCloseYes");
  if (cy) cy.onclick = () => { const no = m.no; state.modal = null; act(() => closeTable(t), `Table ${no} closed`); };
}

function limitFormCard() {
  return `
    <div class="limit" id="lf">
      <div class="lname">New limit</div>
      <div class="row">
        <select id="lfGame"><option>NLH</option><option>PLO</option><option>MIX</option></select>
        <input id="lfSb" class="w70" inputmode="decimal" placeholder="SB" />
        <input id="lfBb" class="w70" inputmode="decimal" placeholder="BB" />
      </div>
      <div class="row">
        <input id="lfMin" class="w120" inputmode="numeric" placeholder="Min buy-in" />
        <input id="lfMax" class="w120" inputmode="numeric" placeholder="Max (empty = none)" />
      </div>
      <div class="row">
        <input id="lfRake" class="w90" inputmode="decimal" placeholder="Rake %" />
        <input id="lfCap" class="w90" inputmode="decimal" placeholder="Rake cap" />
      </div>
      <div class="row">
        <button class="btn gold" id="lfSave">Save limit</button>
        <button class="btn" id="lfCancel">Cancel</button>
      </div>
      <div class="err" id="lfErr"></div>
      <div class="hint">A new limit starts closed — open its tables with “+ Open table”.</div>
    </div>`;
}

function bindLimitForm() {
  if (!state.limitForm) return;
  const v = (id) => document.getElementById(id).value.trim();
  const n = (id) => { const x = parseFloat(v(id).replace(",", ".")); return x > 0 ? x : null; };
  document.getElementById("lfCancel").onclick = () => { state.limitForm = false; render(); };
  document.getElementById("lfSave").onclick = () => {
    const sbv = n("lfSb"), bbv = n("lfBb");
    if (!sbv || !bbv || bbv < sbv) return (document.getElementById("lfErr").textContent = "Check the blinds — big blind must be ≥ small blind.");
    state.limitForm = false;
    act(() => floor("POST", { action: "add-limit", venueId: state.venue, game: v("lfGame"), sb: sbv, bb: bbv,
      min_buyin: n("lfMin"), max_buyin: n("lfMax"), rake_pct: n("lfRake"), rake_cap: n("lfCap") }), "Limit added");
  };
}

function render() {
  $app.classList.remove("fit"); // only the tables page fills the screen
  if (!state.session) return renderLogin();
  if (!state.venue) return renderNoAccess();
  if (state.mustChange) return renderFirstPassword();
  if (state.view === "staff" && state.owner) return renderStaff();
  if (state.view === "limits") return renderLimits();
  // keep typing intact: no full re-render while a form is being filled in
  renderPanel();
}

async function start(session) {
  state.session = session;
  if (!session) { state.venue = null; state.owner = false; state.step = "email"; state.login = "password"; return render(); }
  $app.innerHTML = `<div class="updated">Loading…</div>`;
  try {
    const { venues, owner, name, mustChange } = await floor("GET");
    state.name = name || nameOf(session.user.email);
    state.mustChange = !!mustChange;
    state.venues = venues || [];
    state.venue = state.venues.includes("palms-royale-sofia") ? "palms-royale-sofia" : state.venues[0] || null;
    state.owner = !!state.venue && (owner || []).includes(state.venue);
    state.view = "cash";
    if (state.venue) await loadTables();
  } catch (e) {
    toast(e.message);
  }
  if (state.freshSignIn && state.venue) {
    state.freshSignIn = false;
    await playIntro(`Welcome ${state.name}`);
  }
  render();
}

// The intro after signing in (Leo, 23.11): the logo alone, then "Welcome Ani
// Raycheva" typed out letter by letter, then the floor panel.
function playIntro(text) {
  return new Promise((done) => {
    const el = document.createElement("div");
    el.className = "intro";
    el.innerHTML = `<img class="introLogo" src="logo.png" alt="Palms Poker" /><div class="introText"><span class="typed"></span><span class="caret"></span></div>`;
    document.body.appendChild(el);
    const typed = el.querySelector(".typed");
    let i = 0;
    const finish = () => {
      el.classList.add("out");
      setTimeout(() => { el.remove(); done(); }, 450);
    };
    const type = () => {
      typed.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(type, text[i - 1] === " " ? 140 : 75);
      else setTimeout(finish, 1100);
    };
    setTimeout(type, 900); // the logo first
    el.onclick = finish;   // a tap skips it
  });
}

// a new sign-in or sign-out reloads; a silent token refresh only swaps the session
sb.auth.onAuthStateChange((_e, session) => {
  if ((session?.user?.id || null) !== (state.session?.user?.id || null)) start(session);
  else state.session = session;
});
sb.auth.getSession().then(({ data }) => start(data.session));

// live: other staff (or the app) change tables too
setInterval(async () => {
  if (!state.venue || state.view !== "cash" || state.busy || state.modal || state.limitForm || document.activeElement?.tagName === "INPUT") return;
  try { await loadTables(); render(); } catch {}
}, 10000);
</script>
